<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">
    <title>The Coil — Growth OS</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;400;600;800&family=Oswald:wght@500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #050505;
            color: #e4e4e7;
            overscroll-behavior: none;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Cinzel', serif;
        }
        .font-condensed {
            font-family: 'Oswald', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Gold Gradient Text */
        .text-gold-gradient {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Glassmorphism Card */
        .glass-panel {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(50, 50, 50, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Gradient Border */
        .gradient-border-left {
            border-left: 3px solid;
            border-image: linear-gradient(to bottom, #d4af37, #000) 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
        
        /* Animations */
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
            50% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0.1); }
        }
        .btn-pulse { animation: pulse-gold 2s infinite; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeSlide 0.4s ease forwards; }

        /* Status dot pulse */
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .status-pulse { animation: statusPulse 2s ease infinite; }

        /* Safe area for notched phones */
        .safe-bottom {
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        }

        /* Mobile bottom nav */
        .bottom-nav {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 10, 10, 0.92);
            border-top: 1px solid rgba(50, 50, 50, 0.5);
        }
        .bottom-nav-item {
            transition: all 0.2s ease;
        }
        .bottom-nav-item.active {
            color: #d4af37;
        }
        .bottom-nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #d4af37;
        }

        /* Pull-to-refresh indicator */
        .pull-indicator {
            transition: transform 0.3s ease;
        }

        /* Swipeable cards */
        .swipe-card {
            scroll-snap-align: start;
        }
        .swipe-container {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        /* Touch-friendly tap targets - min 44px */
        .tap-target {
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Slide transitions */
        .slide-enter { transform: translateX(100%); opacity: 0; }
        .slide-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease; }

        /* Collapsible section */
        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
        }
        .collapsible-content.open {
            max-height: 1000px;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#d4af37',
                            500: '#bf953f',
                            600: '#b38728',
                            900: 'rgba(212, 175, 55, 0.1)',
                        },
                        instagram: '#E1306C',
                        tiktok: '#00F2EA',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // ─── API LAYER ───────────────────────────────────────────────
        
        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(`/api/${endpoint}`, options);
                const data = await response.json();
                return { ok: response.ok, data };
            } catch (err) {
                console.warn(`[API] ${endpoint} failed:`, err.message);
                return { ok: false, data: null, error: err.message };
            }
        }

        // ─── LOCAL CACHE ─────────────────────────────────────────────

        const cache = {
            set(key, data) {
                try {
                    localStorage.setItem(`coil_${key}`, JSON.stringify({ data, ts: Date.now() }));
                } catch(e) {}
            },
            get(key, maxAge = 300000) { // 5 min default
                try {
                    const raw = localStorage.getItem(`coil_${key}`);
                    if (!raw) return null;
                    const { data, ts } = JSON.parse(raw);
                    if (Date.now() - ts > maxAge) return null;
                    return data;
                } catch(e) { return null; }
            }
        };

        // ─── ICONS (Lucide) ──────────────────────────────────────────
        
        const Icon = ({ name, size = 18, className = "" }) => {
            const ref = React.useRef(null);
            useEffect(() => {
                if (ref.current && lucide.icons[name]) {
                    ref.current.innerHTML = '';
                    const svg = lucide.createElement(lucide.icons[name]);
                    svg.setAttribute('width', size);
                    svg.setAttribute('height', size);
                    if (className) svg.setAttribute('class', className);
                    ref.current.appendChild(svg);
                }
            }, [name, size, className]);
            return <span ref={ref} style={{display:'inline-flex', verticalAlign:'middle'}} />;
        };

        // ─── STAT CARD (Mobile: horizontal swipe strip) ──────────────

        const StatCard = ({ title, value, icon, subtext, accentColor = "text-gold-400", loading = false }) => (
            <div className="glass-panel p-4 md:p-5 rounded-xl border-l-2 border-l-gold-500 relative overflow-hidden min-w-[160px] swipe-card snap-start flex-shrink-0 md:flex-shrink md:min-w-0">
                <div className="flex justify-between items-start">
                    <div>
                        <p className="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold">{title}</p>
                        <h3 className={`text-2xl md:text-3xl font-condensed mt-1 md:mt-2 text-white ${loading ? 'animate-pulse' : ''}`}>
                            {loading ? '—' : value}
                        </h3>
                        <p className="text-[10px] md:text-xs text-zinc-400 mt-0.5">{subtext}</p>
                    </div>
                    <div className={`p-2 rounded-full bg-zinc-900/50 ${accentColor}`}>
                        <Icon name={icon} size={20} />
                    </div>
                </div>
            </div>
        );

        // ─── APPOINTMENT SLOT (Touch-friendly) ──────────────────────

        const AppointmentSlot = ({ appointment, index }) => {
            const time = new Date(appointment.datetime);
            const hour = time.getHours();
            const min = String(time.getMinutes()).padStart(2, '0');
            const period = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour > 12 ? hour - 12 : hour === 0 ? 12 : hour;
            const timeStr = `${displayHour}:${min}`;
            
            const isVIP = appointment.labels?.some(l => l.name === 'VIP');
            const isPaid = appointment.paid === 'yes';

            return (
                <div className="flex gap-3 md:gap-4 relative fade-in" style={{animationDelay: `${index * 0.06}s`}}>
                    <div className="w-11 md:w-12 text-right text-xs text-zinc-500 font-mono py-3 md:py-2 flex flex-col items-end">
                        <span>{timeStr}</span>
                        <span className="text-[9px] text-zinc-600">{period}</span>
                    </div>
                    <div className={`flex-1 p-3 md:p-3 rounded-lg active:scale-[0.98] transition-all cursor-pointer tap-target ${
                        isVIP ? 'bg-gold-900 border-l-2 border-l-gold-500 ring-1 ring-gold-500/20' :
                        'bg-zinc-900/80 border-l-2 border-l-emerald-500'
                    }`}>
                        <div className="flex justify-between items-center">
                            <h4 className="text-sm font-bold text-white">
                                {appointment.firstName} {appointment.lastName}
                            </h4>
                            <div className="flex gap-1.5">
                                {isVIP && (
                                    <span className="text-[10px] bg-gold-900 text-gold-400 px-1.5 py-0.5 rounded border border-gold-500/30">VIP</span>
                                )}
                                <span className={`text-[10px] px-1.5 py-0.5 rounded ${
                                    isPaid ? 'bg-emerald-900/30 text-emerald-400' : 'bg-zinc-800 text-zinc-500'
                                }`}>
                                    {isPaid ? 'PAID' : 'DUE'}
                                </span>
                            </div>
                        </div>
                        <p className="text-xs text-zinc-400 mt-1">
                            {appointment.type}
                            <span className="text-zinc-500 font-mono ml-2">${appointment.price}</span>
                        </p>
                    </div>
                </div>
            );
        };

        // ─── OPEN SLOT ───────────────────────────────────────────────

        const OpenSlot = ({ time }) => (
            <div className="flex gap-3 md:gap-4 relative opacity-50">
                <div className="w-11 md:w-12 text-right text-xs text-zinc-500 font-mono py-3 md:py-2">{time}</div>
                <div className="flex-1 border border-zinc-800 border-dashed p-3 rounded-lg flex items-center justify-center gap-2 text-zinc-500 active:text-zinc-300 active:border-zinc-600 transition-colors cursor-pointer tap-target">
                    <Icon name="plus" size={14} /><span className="font-condensed text-xs tracking-widest">OPEN SLOT</span>
                </div>
            </div>
        );

        // ─── PUSH NOTIFICATION PANEL (Enhanced) ─────────────────────────

        const SEGMENTS = [
            { id: 'all',     label: 'All Clients', icon: 'users',          color: 'text-white' },
            { id: 'vip',     label: 'VIP Only',    icon: 'crown',          color: 'text-gold-400' },
            { id: 'dormant', label: 'Dormant',     icon: 'alert-triangle', color: 'text-red-400' },
            { id: 'new',     label: 'New Clients',  icon: 'user-plus',     color: 'text-emerald-400' },
            { id: 'custom',  label: 'Custom',       icon: 'filter',        color: 'text-blue-400' },
        ];

        const CHANNELS = [
            { id: 'sms',   label: 'SMS',   icon: 'smartphone' },
            { id: 'email', label: 'Email', icon: 'mail' },
            { id: 'both',  label: 'Both',  icon: 'send' },
        ];

        // Mock scheduled blasts
        const getUpcomingBlasts = () => {
            const today = new Date();
            return [
                {
                    id: 1,
                    date: new Date(today.getTime() + 86400000), // tomorrow
                    time: '10:00 AM',
                    message: 'Tuesday Special: Book a fade, get a free beard trim 🔥',
                    segment: 'all',
                    channel: 'sms',
                    recipients: 47,
                    status: 'scheduled',
                },
                {
                    id: 2,
                    date: new Date(today.getTime() + 86400000 * 2), // day after
                    time: '2:00 PM',
                    message: 'We miss you! Come back for 25% off your next visit 💈',
                    segment: 'dormant',
                    channel: 'both',
                    recipients: 12,
                    status: 'scheduled',
                },
                {
                    id: 3,
                    date: new Date(today.getTime() + 86400000 * 3),
                    time: '9:00 AM',
                    message: 'VIP Early Access: New product line dropping this weekend ✨',
                    segment: 'vip',
                    channel: 'email',
                    recipients: 8,
                    status: 'draft',
                },
            ];
        };

        const PushNotificationPanel = ({ clientCount, clients = [] }) => {
            const [message, setMessage] = useState("Flash Sale: 20% off all cuts until 4PM today! ✂️");
            const [sent, setSent] = useState(false);
            const [selectedSegment, setSelectedSegment] = useState('all');
            const [selectedChannel, setSelectedChannel] = useState('sms');
            const [showScheduled, setShowScheduled] = useState(true);
            const scheduledBlasts = getUpcomingBlasts();

            // Compute recipient count based on segment
            const getRecipientCount = () => {
                if (!clients || clients.length === 0) return clientCount;
                switch (selectedSegment) {
                    case 'vip':     return clients.filter(c => c.tags?.includes('VIP')).length;
                    case 'dormant': return clients.filter(c => c.tags?.includes('Dormant')).length;
                    case 'new':     return clients.filter(c => c.tags?.includes('New')).length;
                    case 'custom':  return Math.floor(clientCount * 0.6); // placeholder
                    default:        return clientCount;
                }
            };
            const recipientCount = getRecipientCount();
            const activeSegment = SEGMENTS.find(s => s.id === selectedSegment);
            
            const handleBlast = () => {
                setSent(true);
                setTimeout(() => setSent(false), 3000);
            };

            const formatDay = (date) => {
                const today = new Date();
                const diff = Math.floor((date - today) / 86400000);
                if (diff === 0) return 'Today';
                if (diff === 1) return 'Tomorrow';
                return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            };

            const segmentLabel = (id) => SEGMENTS.find(s => s.id === id)?.label || id;

            return (
                <div className="glass-panel p-5 md:p-6 rounded-xl border border-gold-500/30 relative">
                    {/* Header */}
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="text-gold-400 font-serif text-sm md:text-base flex items-center gap-2">
                            <Icon name="bell" size={16} /> PUSH ENGINE
                        </h3>
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)] status-pulse"></div>
                            <span className="text-[10px] text-emerald-500 font-mono">ACTIVE</span>
                        </div>
                    </div>

                    {/* ── AUDIENCE SEGMENT PICKER ── */}
                    <div className="mb-4">
                        <label className="text-[10px] text-zinc-500 uppercase tracking-wider mb-2 block">Audience</label>
                        <div className="flex gap-1.5 flex-wrap">
                            {SEGMENTS.map(seg => (
                                <button
                                    key={seg.id}
                                    className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium transition-all active:scale-[0.96] tap-target ${
                                        selectedSegment === seg.id 
                                            ? 'bg-zinc-700 border border-zinc-500 text-white' 
                                            : 'bg-zinc-900/60 border border-zinc-800 text-zinc-500 hover:text-zinc-300'
                                    }`}
                                    onClick={() => setSelectedSegment(seg.id)}
                                >
                                    <Icon name={seg.icon} size={12} className={selectedSegment === seg.id ? seg.color : ''} />
                                    <span className="hidden sm:inline">{seg.label}</span>
                                    <span className="sm:hidden">{seg.label.split(' ')[0]}</span>
                                </button>
                            ))}
                        </div>
                        <div className="mt-2 flex items-center gap-2 text-xs">
                            <span className={activeSegment?.color || 'text-white'}>{recipientCount}</span>
                            <span className="text-zinc-500">recipients selected</span>
                        </div>
                    </div>

                    {/* ── CHANNEL SELECTOR ── */}
                    <div className="mb-4">
                        <label className="text-[10px] text-zinc-500 uppercase tracking-wider mb-2 block">Channel</label>
                        <div className="flex gap-2">
                            {CHANNELS.map(ch => (
                                <button
                                    key={ch.id}
                                    className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-medium transition-all active:scale-[0.96] tap-target ${
                                        selectedChannel === ch.id 
                                            ? 'bg-gold-900 border border-gold-500/30 text-gold-400' 
                                            : 'bg-zinc-900/60 border border-zinc-800 text-zinc-500'
                                    }`}
                                    onClick={() => setSelectedChannel(ch.id)}
                                >
                                    <Icon name={ch.icon} size={13} />
                                    {ch.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* ── MESSAGE COMPOSER ── */}
                    <div className="bg-black border border-zinc-800 rounded-lg p-3 md:p-4 mb-4">
                        <label className="text-[10px] text-zinc-500 uppercase tracking-wider mb-2 block">Campaign Message</label>
                        <textarea 
                            className="w-full bg-transparent text-sm text-zinc-300 focus:outline-none resize-none h-16"
                            value={message}
                            onChange={(e) => setMessage(e.target.value)}
                            placeholder="Type your campaign message..."
                        />
                        <div className="flex justify-between items-center mt-2 text-[10px] text-zinc-600">
                            <span>{message.length}/160 chars</span>
                            <span>{selectedChannel === 'email' ? 'Subject line recommended' : 'SMS limit: 160'}</span>
                        </div>
                    </div>
                    
                    {/* ── BLAST BUTTON ── */}
                    <button 
                        className={`w-full font-bold text-xs uppercase py-3.5 rounded-lg tracking-wider flex items-center justify-center gap-2 transition-all active:scale-[0.97] ${
                            sent ? 'bg-emerald-600 text-white' : 
                            recipientCount === 0 ? 'bg-zinc-800 text-zinc-600 cursor-not-allowed' :
                            'bg-gold-500 hover:bg-gold-400 text-black btn-pulse'
                        }`}
                        onClick={handleBlast}
                        disabled={recipientCount === 0}
                    >
                        <Icon name={sent ? "check" : "send"} size={14} />
                        {sent ? 'SENT ✓' : `Blast to ${recipientCount} ${activeSegment?.label || 'Clients'}`}
                    </button>
                    
                    {/* ── AUTO TRIGGER ── */}
                    <div className="mt-4 pt-3 border-t border-zinc-800 flex justify-between items-center text-xs">
                        <span className="text-zinc-500">Auto-Trigger: <span className="text-white">Low Occupancy</span></span>
                        <div className="w-10 h-5 bg-gold-900 rounded-full relative cursor-pointer tap-target">
                            <div className="absolute right-0.5 top-0.5 w-4 h-4 bg-gold-500 rounded-full shadow-[0_0_8px_rgba(212,175,55,0.4)]"></div>
                        </div>
                    </div>

                    {/* ── UPCOMING SCHEDULED BLASTS ── */}
                    <div className="mt-4 pt-4 border-t border-zinc-800">
                        <button 
                            className="w-full flex items-center justify-between text-xs tap-target"
                            onClick={() => setShowScheduled(!showScheduled)}
                        >
                            <span className="text-zinc-400 uppercase tracking-widest font-semibold flex items-center gap-2">
                                <Icon name="clock" size={13} /> Upcoming Blasts
                            </span>
                            <div className="flex items-center gap-2">
                                <span className="bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded text-[10px]">{scheduledBlasts.length}</span>
                                <div className={`transition-transform duration-300 ${showScheduled ? 'rotate-180' : ''}`}>
                                    <Icon name="chevron-down" size={14} className="text-zinc-600" />
                                </div>
                            </div>
                        </button>
                        
                        <div className={`collapsible-content ${showScheduled ? 'open' : ''}`}>
                            <div className="space-y-3 mt-3">
                                {scheduledBlasts.map((blast) => (
                                    <div key={blast.id} className="bg-zinc-900/50 border border-zinc-800 rounded-lg p-3 relative">
                                        {/* Date & Status Row */}
                                        <div className="flex items-center justify-between mb-2">
                                            <div className="flex items-center gap-2">
                                                <span className="text-xs font-mono text-zinc-300">{formatDay(blast.date)}</span>
                                                <span className="text-[10px] text-zinc-600">@ {blast.time}</span>
                                            </div>
                                            <span className={`text-[10px] px-1.5 py-0.5 rounded ${
                                                blast.status === 'scheduled' 
                                                    ? 'bg-emerald-900/30 text-emerald-400 border border-emerald-800/50' 
                                                    : 'bg-zinc-800 text-zinc-500 border border-zinc-700'
                                            }`}>
                                                {blast.status === 'scheduled' ? '⏱ Scheduled' : '✏️ Draft'}
                                            </span>
                                        </div>
                                        
                                        {/* Message Preview */}
                                        <p className="text-xs text-zinc-400 mb-2 line-clamp-2 leading-relaxed">{blast.message}</p>
                                        
                                        {/* Meta Row */}
                                        <div className="flex items-center gap-3 text-[10px] text-zinc-600">
                                            <span className="flex items-center gap-1">
                                                <Icon name={SEGMENTS.find(s => s.id === blast.segment)?.icon || 'users'} size={10} />
                                                {segmentLabel(blast.segment)}
                                            </span>
                                            <span>•</span>
                                            <span className="flex items-center gap-1">
                                                <Icon name={CHANNELS.find(c => c.id === blast.channel)?.icon || 'send'} size={10} />
                                                {blast.channel.toUpperCase()}
                                            </span>
                                            <span>•</span>
                                            <span>{blast.recipients} recipients</span>
                                        </div>
                                    </div>
                                ))}
                                
                                {/* Add Scheduled Blast Button */}
                                <button className="w-full py-2.5 border border-dashed border-zinc-800 rounded-lg text-xs text-zinc-600 flex items-center justify-center gap-2 active:text-zinc-400 active:border-zinc-600 transition-colors tap-target">
                                    <Icon name="plus" size={13} />
                                    <span className="font-condensed tracking-wider">SCHEDULE NEW BLAST</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── CLIENT LIST ITEM ────────────────────────────────────────

        const ClientListItem = ({ client, index }) => (
            <div className="flex items-center justify-between p-3 bg-zinc-900/30 border border-zinc-800 rounded-lg active:bg-zinc-800 transition-all cursor-pointer fade-in tap-target" style={{animationDelay: `${index * 0.04}s`}}>
                <div className="flex items-center gap-3">
                    <div className="w-9 h-9 bg-zinc-800 rounded-full flex items-center justify-center text-xs font-bold text-zinc-400">
                        {client.firstName?.[0]}{client.lastName?.[0]}
                    </div>
                    <div>
                        <h4 className="text-sm font-medium text-zinc-200">{client.firstName} {client.lastName}</h4>
                        <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                            <span className="text-[10px] text-zinc-500">{client.appointments || 0} visits</span>
                            {client.tags?.map(tag => (
                                <span key={tag} className={`text-[10px] px-1.5 py-0.5 rounded border ${
                                    tag === 'VIP' ? 'border-gold-500/30 text-gold-400 bg-gold-900' :
                                    tag === 'Dormant' ? 'border-red-900 text-red-400 bg-red-900/10' :
                                    tag === 'New' ? 'border-emerald-900 text-emerald-400 bg-emerald-900/10' :
                                    'border-zinc-800 text-zinc-500'
                                }`}>{tag}</span>
                            ))}
                        </div>
                    </div>
                </div>
                <div className="text-right">
                    <p className="text-xs font-mono text-zinc-400">${client.revenue || 0}</p>
                </div>
            </div>
        );

        // ─── COLLAPSIBLE SECTION (Mobile) ────────────────────────────

        const CollapsibleSection = ({ title, icon, iconColor, badge, children, defaultOpen = true }) => {
            const [open, setOpen] = useState(defaultOpen);
            
            return (
                <div className="glass-panel rounded-xl overflow-hidden">
                    <button 
                        className="w-full p-4 md:p-5 flex items-center justify-between tap-target"
                        onClick={() => setOpen(!open)}
                    >
                        <h3 className="font-condensed text-lg flex items-center gap-2">
                            <Icon name={icon} size={18} className={iconColor} /> {title}
                        </h3>
                        <div className="flex items-center gap-2">
                            {badge && <span className="text-[10px] bg-zinc-800 px-2 py-1 rounded text-zinc-400">{badge}</span>}
                            <div className={`transition-transform duration-300 ${open ? 'rotate-180' : ''}`}>
                                <Icon name="chevron-down" size={16} className="text-zinc-500" />
                            </div>
                        </div>
                    </button>
                    <div className={`collapsible-content ${open ? 'open' : ''}`}>
                        <div className="px-4 md:px-5 pb-4 md:pb-5">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // ─── SYSTEM STATUS ───────────────────────────────────────────

        const SystemStatus = ({ apiMode }) => {
            const statuses = [
                { name: 'Acuity API', status: apiMode === 'live' ? 'Connected' : 'Demo', live: apiMode === 'live' },
                { name: 'Push Engine', status: 'Ready', live: true },
                { name: 'Webhook', status: 'Active', live: true },
                { name: 'CRM', status: apiMode === 'live' ? 'Synced' : 'Mock Data', live: apiMode === 'live' },
            ];
            return (
                <div className="glass-panel p-4 md:p-5 rounded-xl">
                    <h3 className="text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-3">System Status</h3>
                    <div className="grid grid-cols-2 md:grid-cols-1 gap-2">
                        {statuses.map(s => (
                            <div key={s.name} className="flex justify-between items-center text-xs p-2 bg-zinc-900/30 rounded-lg md:bg-transparent md:p-0">
                                <span className="text-zinc-400">{s.name}</span>
                                <div className="flex items-center gap-1.5">
                                    <div className={`w-1.5 h-1.5 rounded-full ${s.live ? 'bg-emerald-500' : 'bg-amber-500'} status-pulse`}></div>
                                    <span className={s.live ? 'text-emerald-400' : 'text-amber-400'}>
                                        {s.status}
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ─── MOBILE TAB VIEWS ────────────────────────────────────────

        const TAB_BOOK = 'book';
        const TAB_CLIENTS = 'clients';
        const TAB_PUSH = 'push';
        const TAB_STATUS = 'status';

        // ─── MAIN DASHBOARD ──────────────────────────────────────────

        const Dashboard = () => {
            const [appointments, setAppointments] = useState([]);
            const [clients, setClients] = useState([]);
            const [apiMode, setApiMode] = useState("loading");
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState(TAB_BOOK);
            const [refreshing, setRefreshing] = useState(false);

            // Load data (with cache fallback)
            const loadData = useCallback(async (forceRefresh = false) => {
                // Try cache first for instant render
                if (!forceRefresh) {
                    const cachedAppts = cache.get('appointments');
                    const cachedClients = cache.get('clients');
                    if (cachedAppts && cachedClients) {
                        setAppointments(cachedAppts.appointments || []);
                        setApiMode(cachedAppts.mode || "demo");
                        setClients(cachedClients.clients || []);
                        setLoading(false);
                    }
                }

                // Fetch fresh data
                const [apptResult, clientResult] = await Promise.all([
                    fetchAPI('appointments'),
                    fetchAPI('clients')
                ]);

                if (apptResult.ok && apptResult.data) {
                    setAppointments(apptResult.data.appointments || []);
                    setApiMode(apptResult.data.mode || "demo");
                    cache.set('appointments', apptResult.data);
                }
                
                if (clientResult.ok && clientResult.data) {
                    setClients(clientResult.data.clients || []);
                    cache.set('clients', clientResult.data);
                }

                setLoading(false);
                setRefreshing(false);
            }, []);

            useEffect(() => { loadData(); }, [loadData]);

            const handleRefresh = () => {
                setRefreshing(true);
                loadData(true);
            };

            // Compute live stats from appointments
            const dailyRevenue = appointments.reduce((sum, a) => sum + parseFloat(a.price || 0), 0);
            const totalBookings = appointments.length;
            const paidBookings = appointments.filter(a => a.paid === 'yes').length;
            const vipCount = appointments.filter(a => a.labels?.some(l => l.name === 'VIP')).length;
            const clientCount = clients.length;
            const dormantClients = clients.filter(c => c.tags?.includes('Dormant'));

            // Find gaps in schedule
            const bookedHours = new Set(appointments.map(a => new Date(a.datetime).getHours()));
            const openSlots = [];
            for (let h = 9; h < 18; h++) {
                if (!bookedHours.has(h)) {
                    const displayH = h > 12 ? h - 12 : h;
                    openSlots.push(`${displayH}:00`);
                }
            }

            return (
                <div className="min-h-screen flex flex-col">
                    
                    {/* ─── HEADER ──────────────────────────────────── */}
                    <header className="px-4 pt-4 pb-3 md:px-8 md:pt-6 md:pb-6 border-b border-zinc-900">
                        <div className="flex justify-between items-center max-w-[1600px] mx-auto">
                            <div>
                                <div className="flex items-center gap-2 mb-0.5">
                                    <span className="text-gold-500 border border-gold-500/50 px-2 py-0.5 rounded text-[9px] md:text-[10px] tracking-widest font-condensed">GROWTH OS v2.1</span>
                                </div>
                                <h1 className="text-2xl md:text-4xl font-serif text-white tracking-tight">THE COIL <span className="text-zinc-600">OPS</span></h1>
                            </div>
                            <div className="flex gap-4 md:gap-6 items-center">
                                {/* Refresh button - mobile */}
                                <button onClick={handleRefresh} className="tap-target md:hidden">
                                    <Icon name="refresh-cw" size={18} className={`text-zinc-500 ${refreshing ? 'animate-spin' : ''}`} />
                                </button>
                                <div className="text-right hidden md:block">
                                    <p className="text-zinc-500 text-xs uppercase">Acuity</p>
                                    <p className={`text-sm font-mono flex items-center justify-end gap-1 ${
                                        apiMode === 'live' ? 'text-emerald-500' :
                                        apiMode === 'demo' ? 'text-amber-500' :
                                        'text-zinc-500'
                                    }`}>
                                        <Icon name="zap" size={12} />
                                        {apiMode === 'live' ? 'LIVE' : apiMode === 'demo' ? 'DEMO' : '...'}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="text-zinc-500 text-[10px] md:text-xs uppercase">Today</p>
                                    <p className="text-white text-xs md:text-sm font-mono">{new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* ─── DEMO BANNER ─────────────────────────────── */}
                    {apiMode === 'demo' && !loading && (
                        <div className="mx-4 md:mx-8 mt-3 bg-amber-900/20 border border-amber-700/30 rounded-lg p-2.5 md:p-3 flex items-center gap-2 max-w-[1600px] md:mx-auto md:w-full md:px-8">
                            <Icon name="info" size={14} className="text-amber-500 flex-shrink-0" />
                            <p className="text-[10px] md:text-xs text-amber-400">
                                <strong>Demo Mode</strong> — Sample data. Connect Acuity API to go live.
                            </p>
                        </div>
                    )}

                    {/* ─── STATS STRIP (Horizontal scroll on mobile) ── */}
                    <div className="px-4 md:px-8 py-4 max-w-[1600px] md:mx-auto md:w-full">
                        <div className="flex gap-3 md:gap-4 overflow-x-auto pb-2 md:pb-0 swipe-container md:grid md:grid-cols-4 md:overflow-visible">
                            <StatCard 
                                title="Revenue" 
                                value={`$${dailyRevenue.toLocaleString()}`}
                                subtext={`${paidBookings}/${totalBookings} paid`}
                                icon="dollar-sign"
                                loading={loading}
                            />
                            <StatCard 
                                title="Clients" 
                                value={clientCount.toLocaleString()}
                                subtext={`${clients.filter(c => c.tags?.includes('VIP')).length} VIP`}
                                icon="users"
                                accentColor="text-pink-500"
                                loading={loading}
                            />
                            <StatCard 
                                title="Open Slots" 
                                value={openSlots.length.toString()}
                                subtext={openSlots.length > 0 ? `Next: ${openSlots[0]}` : "Booked 🔥"}
                                icon="calendar"
                                accentColor="text-blue-500"
                                loading={loading}
                            />
                            <StatCard 
                                title="Bookings" 
                                value={totalBookings.toString()}
                                subtext={`${vipCount} VIP today`}
                                icon="scissors"
                                loading={loading}
                            />
                        </div>
                    </div>

                    {/* ─── MAIN CONTENT ────────────────────────────── */}
                    <div className="flex-1 px-4 md:px-8 pb-24 md:pb-8 max-w-[1600px] md:mx-auto md:w-full">
                        
                        {/* DESKTOP: 3-column grid */}
                        <div className="hidden lg:grid lg:grid-cols-12 gap-6">
                            
                            {/* LEFT: CLIENT CRM */}
                            <div className="lg:col-span-4 space-y-6">
                                <CollapsibleSection title="CLIENT BOOK" icon="users" iconColor="text-pink-500" badge={`${clientCount} TOTAL`}>
                                    <div className="space-y-2 max-h-[320px] overflow-y-auto">
                                        {clients.slice(0, 6).map((client, i) => (
                                            <ClientListItem key={client.id || i} client={client} index={i} />
                                        ))}
                                    </div>
                                </CollapsibleSection>

                                {dormantClients.length > 0 && (
                                    <div className="glass-panel p-4 rounded-xl border border-red-900/30">
                                        <h3 className="text-xs text-red-400 uppercase tracking-widest font-semibold mb-3 flex items-center gap-2">
                                            <Icon name="alert-triangle" size={14} /> Re-Engage ({dormantClients.length})
                                        </h3>
                                        {dormantClients.map(client => (
                                            <div key={client.id} className="flex items-center justify-between py-2 border-b border-zinc-800/50 last:border-0">
                                                <div>
                                                    <p className="text-sm text-zinc-300">{client.firstName} {client.lastName}</p>
                                                    <p className="text-[10px] text-zinc-600">Last: {client.lastVisit}</p>
                                                </div>
                                                <button className="text-[10px] bg-gold-900 text-gold-400 px-2.5 py-1.5 rounded border border-gold-500/20 active:bg-gold-500/20 tap-target">
                                                    Send Offer
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* CENTER: THE BOOK (SCHEDULE) */}
                            <div className="lg:col-span-5 space-y-6">
                                <div className="glass-panel p-6 rounded-xl h-full flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-serif text-2xl text-gold-400">THE BOOK</h3>
                                        <div className="text-xs text-zinc-500 font-mono">
                                            {apiMode === 'live' ? 'ACUITY LIVE' : 'DEMO VIEW'}
                                        </div>
                                    </div>
                                    
                                    <div className="flex-1 relative space-y-3 overflow-y-auto max-h-[500px]">
                                        <div className="absolute left-[22px] top-0 bottom-0 w-px bg-zinc-800"></div>
                                        
                                        {loading ? (
                                            <div className="flex items-center justify-center py-16 text-zinc-600">
                                                <div className="flex flex-col items-center gap-3">
                                                    <div className="w-8 h-8 border-2 border-gold-500/30 border-t-gold-500 rounded-full animate-spin"></div>
                                                    <span className="text-xs font-mono">LOADING...</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <>
                                                {appointments.map((appt, i) => (
                                                    <AppointmentSlot key={appt.id || i} appointment={appt} index={i} />
                                                ))}
                                                {openSlots.slice(0, 3).map((slot, i) => (
                                                    <OpenSlot key={slot} time={slot} />
                                                ))}
                                            </>
                                        )}
                                    </div>

                                    <div className="mt-4 pt-4 border-t border-zinc-800 flex justify-between items-center text-xs">
                                        <span className="text-zinc-500">{totalBookings} booked • {openSlots.length} open</span>
                                        <span className="text-gold-400 font-mono">${dailyRevenue.toLocaleString()} projected</span>
                                    </div>
                                </div>
                            </div>

                            {/* RIGHT: ACTIONS */}
                            <div className="lg:col-span-3 space-y-6">
                                <PushNotificationPanel clientCount={clientCount} clients={clients} />
                                
                                {/* Revenue Breakdown */}
                                <div className="glass-panel p-5 rounded-xl">
                                    <h3 className="text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-3">Revenue</h3>
                                    <div className="space-y-3">
                                        {appointments.slice(0, 5).map((appt, i) => (
                                            <div key={appt.id || i} className="flex items-center justify-between py-1 text-sm">
                                                <span className="text-zinc-400 truncate max-w-[140px]">{appt.type}</span>
                                                <span className="text-white font-mono">${appt.price}</span>
                                            </div>
                                        ))}
                                        <div className="pt-2 mt-2 border-t border-zinc-800 flex justify-between font-bold">
                                            <span className="text-zinc-300 text-sm">Total</span>
                                            <span className="text-gold-400 font-mono">${dailyRevenue.toLocaleString()}</span>
                                        </div>
                                    </div>
                                </div>

                                <SystemStatus apiMode={apiMode} />
                            </div>
                        </div>

                        {/* MOBILE: Tab-based single column view */}
                        <div className="lg:hidden space-y-4">
                            
                            {/* THE BOOK TAB */}
                            {activeTab === TAB_BOOK && (
                                <div className="space-y-4 fade-in">
                                    <div className="glass-panel p-5 rounded-xl">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="font-serif text-xl text-gold-400">THE BOOK</h3>
                                            <div className="flex items-center gap-2">
                                                <div className={`w-1.5 h-1.5 rounded-full ${apiMode === 'live' ? 'bg-emerald-500' : 'bg-amber-500'} status-pulse`}></div>
                                                <span className="text-[10px] text-zinc-500 font-mono">{apiMode === 'live' ? 'LIVE' : 'DEMO'}</span>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-2.5 relative">
                                            <div className="absolute left-[22px] top-0 bottom-0 w-px bg-zinc-800"></div>
                                            
                                            {loading ? (
                                                <div className="flex items-center justify-center py-12 text-zinc-600">
                                                    <div className="flex flex-col items-center gap-3">
                                                        <div className="w-8 h-8 border-2 border-gold-500/30 border-t-gold-500 rounded-full animate-spin"></div>
                                                        <span className="text-xs font-mono">LOADING...</span>
                                                    </div>
                                                </div>
                                            ) : (
                                                <>
                                                    {appointments.map((appt, i) => (
                                                        <AppointmentSlot key={appt.id || i} appointment={appt} index={i} />
                                                    ))}
                                                    {openSlots.slice(0, 3).map((slot, i) => (
                                                        <OpenSlot key={slot} time={slot} />
                                                    ))}
                                                </>
                                            )}
                                        </div>

                                        <div className="mt-4 pt-3 border-t border-zinc-800 flex justify-between items-center text-xs">
                                            <span className="text-zinc-500">{totalBookings} booked • {openSlots.length} open</span>
                                            <span className="text-gold-400 font-mono">${dailyRevenue.toLocaleString()}</span>
                                        </div>
                                    </div>

                                    {/* Quick Revenue Cards */}
                                    <div className="glass-panel p-4 rounded-xl">
                                        <h3 className="text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-3">Today's Revenue</h3>
                                        <div className="space-y-2">
                                            {appointments.slice(0, 4).map((appt, i) => (
                                                <div key={appt.id || i} className="flex items-center justify-between py-1.5 text-sm">
                                                    <span className="text-zinc-400 truncate max-w-[180px]">{appt.type}</span>
                                                    <span className="text-white font-mono text-xs">${appt.price}</span>
                                                </div>
                                            ))}
                                            <div className="pt-2 mt-1 border-t border-zinc-800 flex justify-between font-bold">
                                                <span className="text-zinc-300 text-sm">Total</span>
                                                <span className="text-gold-400 font-mono">${dailyRevenue.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* CLIENTS TAB */}
                            {activeTab === TAB_CLIENTS && (
                                <div className="space-y-4 fade-in">
                                    <CollapsibleSection title="CLIENT BOOK" icon="users" iconColor="text-pink-500" badge={`${clientCount}`}>
                                        <div className="space-y-2">
                                            {clients.map((client, i) => (
                                                <ClientListItem key={client.id || i} client={client} index={i} />
                                            ))}
                                        </div>
                                    </CollapsibleSection>

                                    {dormantClients.length > 0 && (
                                        <CollapsibleSection title={`RE-ENGAGE (${dormantClients.length})`} icon="alert-triangle" iconColor="text-red-400" defaultOpen={false}>
                                            <div className="space-y-2">
                                                {dormantClients.map(client => (
                                                    <div key={client.id} className="flex items-center justify-between p-3 bg-zinc-900/30 border border-zinc-800 rounded-lg">
                                                        <div>
                                                            <p className="text-sm text-zinc-300">{client.firstName} {client.lastName}</p>
                                                            <p className="text-[10px] text-zinc-600">Last: {client.lastVisit}</p>
                                                        </div>
                                                        <button className="text-[10px] bg-gold-900 text-gold-400 px-3 py-2 rounded border border-gold-500/20 active:bg-gold-500/20 tap-target">
                                                            Send Offer
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </CollapsibleSection>
                                    )}
                                </div>
                            )}

                            {/* PUSH TAB */}
                            {activeTab === TAB_PUSH && (
                                <div className="space-y-4 fade-in">
                                    <PushNotificationPanel clientCount={clientCount} clients={clients} />
                                </div>
                            )}

                            {/* STATUS TAB */}
                            {activeTab === TAB_STATUS && (
                                <div className="space-y-4 fade-in">
                                    <SystemStatus apiMode={apiMode} />
                                    
                                    {/* Revenue breakdown on status tab too */}
                                    <div className="glass-panel p-4 rounded-xl">
                                        <h3 className="text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-3">Revenue Breakdown</h3>
                                        <div className="space-y-2">
                                            {appointments.map((appt, i) => (
                                                <div key={appt.id || i} className="flex items-center justify-between py-1.5 text-sm">
                                                    <span className="text-zinc-400 truncate max-w-[200px]">{appt.type}</span>
                                                    <span className="text-white font-mono text-xs">${appt.price}</span>
                                                </div>
                                            ))}
                                            <div className="pt-2 mt-1 border-t border-zinc-800 flex justify-between font-bold">
                                                <span className="text-zinc-300 text-sm">Total</span>
                                                <span className="text-gold-400 font-mono">${dailyRevenue.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* ─── MOBILE BOTTOM NAV ────────────────────────── */}
                    <nav className="fixed bottom-0 left-0 right-0 bottom-nav lg:hidden safe-bottom z-50">
                        <div className="flex justify-around items-center px-2 pt-2 pb-1">
                            {[
                                { id: TAB_BOOK, icon: 'calendar', label: 'Book' },
                                { id: TAB_CLIENTS, icon: 'users', label: 'Clients' },
                                { id: TAB_PUSH, icon: 'bell', label: 'Push' },
                                { id: TAB_STATUS, icon: 'activity', label: 'Status' },
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    className={`bottom-nav-item relative flex flex-col items-center gap-1 py-2 px-4 tap-target ${
                                        activeTab === tab.id ? 'active' : 'text-zinc-500'
                                    }`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    <Icon name={tab.icon} size={20} />
                                    <span className="text-[10px] font-condensed tracking-wider">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('[PWA] SW registered:', reg.scope))
                .catch(err => console.warn('[PWA] SW failed:', err));
        }
    </script>
</body>
</html>
